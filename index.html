<!DOCTYPE html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LokasiKita</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }
    .card {
      max-width: 400px;
      margin: 40px auto;
      padding: 25px;
      background: #1e293b;
      border-radius: 20px;
    }
    button {
      padding: 14px 20px;
      border: 0;
      border-radius: 12px;
      background: #22c55e;
      color: #062b15;
      font-size: 16px;
      font-weight: bold;
    }
    #status {
      margin-top: 20px;
      overflow-wrap: anywhere;
    }

<body>
  <h1>💚 LokasiKita</h1>
  <p>Sentiasa dekat, walau berjauhan.</p>
  <div class="card">
    <h2>📍 Lokasi Saya</h2>
    <p>Tekan butang untuk berkongsi lokasi anda.</p>
    <button onclick="cariLokasi()">Dapatkan Lokasi</button>
    <p id="status">Lokasi belum diaktifkan.</p>
  </div>
  <script>
    function cariLokasi() {
      const status = document.getElementById("status");
      if (!navigator.geolocation) {
        status.textContent = "Pelayar ini tidak menyokong lokasi.";
        return;
      }
      status.textContent = "Sedang mendapatkan lokasi...";
      navigator.geolocation.getCurrentPosition(
        function(posisi) {
          const lat = posisi.coords.latitude;
          const lon = posisi.coords.longitude;
          status.innerHTML =
            "Lokasi berjaya diperoleh!<br>" +
            "Latitud: " + lat + "<br>" +
            "Longitud: " + lon + "<br><br>" +
            '<a style="color:#86efac" target="_blank" href="https://www.google.com/maps?q=' +
            lat + ',' + lon + '">Lihat di Google Maps</a>';
        },
        function() {
          status.textContent =
            "Lokasi tidak dapat diperoleh. Benarkan akses lokasi dalam Safari dan cuba lagi.";
        },
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }
  </script>

<section id="akaun" style="max-width:420px;margin:24px auto;padding:20px;background:#fff;color:#172033;border-radius:16px;font-family:Arial,sans-serif">
  <h2>LokasiKita — Akaun</h2>
  <p>Daftar akaun atau log masuk untuk meneruskan.</p>

  <label for="email">E-mel</label>
  <input id="email" type="email" autocomplete="email" placeholder="nama@email.com" style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px">

  <label for="password">Kata laluan (sekurang-kurangnya 6 aksara)</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Kata laluan" style="display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 16px">

  <button id="daftar" style="padding:12px;margin-right:8px">Daftar akaun</button>
  <button id="masuk" style="padding:12px">Log masuk</button>
  <button id="keluar" style="padding:12px;display:none">Log keluar</button>
  <p id="statusAkaun" role="status">Belum log masuk.</p>
</section>

<script type="module">
  import {
  onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword,
  signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import { getAuth } from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "API_KEY_AWAK",
  authDomain: "lokasi-kita-f18b3.firebaseapp.com",
  projectId: "lokasi-kita-f18b3",
  storageBucket: "lokasi-kita-f18b3.firebasestorage.app",
  messagingSenderId: "163006236614",
  appId: "1:163006236614:web:bf654e70c5918076b194c7"
};

const app = initializeApp(firebaseConfig, "akaun");
const auth = getAuth(app);

  const emailInput = document.getElementById("email");
  const passwordInput = document.getElementById("password");
  const statusAkaun = document.getElementById("statusAkaun");
  const daftar = document.getElementById("daftar");
  const masuk = document.getElementById("masuk");
  const keluar = document.getElementById("keluar");

  daftar.addEventListener("click", async () => {
    try {
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || password.length < 6) {
        statusAkaun.textContent = "Masukkan e-mel dan kata laluan sekurang-kurangnya 6 aksara.";
        return;
      }
      await createUserWithEmailAndPassword(auth, email, password);
      statusAkaun.textContent = "Akaun berjaya didaftarkan.";
    } catch (e) {
      statusAkaun.textContent = "Pendaftaran gagal: " + e.message;
    }
  });

  masuk.addEventListener("click", async () => {
    try {
      await signInWithEmailAndPassword(
        auth, emailInput.value.trim(), passwordInput.value
      );
      statusAkaun.textContent = "Log masuk berjaya.";
    } catch (e) {
      statusAkaun.textContent = "Log masuk gagal: " + e.message;
    }
  });

  keluar.addEventListener("click", async () => {
    try {
      await signOut(auth);
      statusAkaun.textContent = "Anda sudah log keluar.";
    } catch (e) {
      statusAkaun.textContent = "Log keluar gagal: " + e.message;
    }
  });

  onAuthStateChanged(auth, user => {
    daftar.style.display = user ? "none" : "inline-block";
    masuk.style.display = user ? "none" : "inline-block";
    keluar.style.display = user ? "inline-block" : "none";
    statusAkaun.textContent = user
      ? "Log masuk sebagai " + user.email
      : "Belum log masuk.";
  });
</script>
</body>
